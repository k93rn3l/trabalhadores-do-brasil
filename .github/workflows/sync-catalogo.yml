name: Sincronizar catálogo

# Sincroniza a planilha privada (Google Sheets) com o catálogo público JSON.
# Executa a cada hora e sob demanda. O commit das alterações dispara
# automaticamente uma nova publicação no Cloudflare Pages (integração GitHub).

on:
  schedule:
    - cron: '0 * * * *' # todo dia, a cada hora (UTC)
  workflow_dispatch:

# Permissões mínimas: apenas escrever no repositório (para o commit dos dados).
permissions:
  contents: write

# Evita execuções concorrentes sobrepondo a mesma sincronização.
concurrency:
  group: sincronizacao-catalogo
  cancel-in-progress: false

jobs:
  sincronizar:
    # schedule/dispatch nunca disparam em pull requests, mas mantemos o
    # guard para impedir acesso a segredos em qualquer evento inesperado.
    if: github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest

    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Instalar dependências do sincronizador
        run: pip install -r scripts/requirements.txt

      - name: Sincronizar Google Sheets → JSON
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_TAB_NAME: ${{ vars.GOOGLE_SHEET_TAB_NAME || 'Respostas de formulário 1' }}
        run: python scripts/sync_catalogo.py --saida public/data --verbose

      - name: Validar catálogo gerado
        run: python scripts/validar_catalogo.py public/data/catalogo.json

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependências do site
        run: npm ci

      - name: Executar testes do site
        run: npm test

      - name: Testar build de produção com os novos dados
        run: npm run build

      - name: Verificar se houve alteração real nos dados
        id: mudancas
        run: |
          if git diff --quiet -- public/data; then
            echo "houve=false" >> "$GITHUB_OUTPUT"
          else
            echo "houve=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commitar catálogo atualizado
        if: steps.mudancas.outputs.houve == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "chore(sync): atualizar catálogo público ($(date -u '+%Y-%m-%d %H:%M') UTC)"
          git push
