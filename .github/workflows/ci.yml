name: CI

# Testes e build a cada push/PR. Este workflow NÃO acessa segredos:
# apenas valida código e dados públicos.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Testes do site (Vitest)
        run: npm test

      - name: Build de produção
        run: npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Instalar dependências do sincronizador
        run: pip install -r scripts/requirements.txt

      - name: Testes do sincronizador (pytest)
        run: pytest scripts/tests -q

      # Guarda LGPD: dados pessoais jamais versionados — catálogo e estado
      # operacional existem só no runner do CI e no site publicado.
      - name: Guarda LGPD — nenhum dado pessoal versionado
        run: |
          if git ls-files public/data dados | grep -q .; then
            echo "FALHA: arquivos de dados versionados (devem ficar fora do git):" >&2
            git ls-files public/data dados >&2
            exit 1
          fi
