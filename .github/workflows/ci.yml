name: CI

# Testes e build a cada push/PR. Este workflow NÃO acessa segredos:
# apenas valida código e dados públicos.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Testes do site (Vitest)
        run: npm test

      - name: Build de produção
        run: npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Instalar dependências do sincronizador
        run: pip install -r scripts/requirements.txt

      - name: Testes do sincronizador (pytest)
        run: pytest scripts/tests -q

      - name: Validar catálogo público
        run: python scripts/validar_catalogo.py public/data/catalogo.json
