name: Sincronizar profissionais

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simular sem gravar'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sincronizacao-profissionais
  cancel-in-progress: false

jobs:
  sincronizar:
    if: github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest

    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Determinar modo
        id: modo
        env:
          HABILITAR_PUBLICACAO: ${{ vars.HABILITAR_PUBLICACAO }}
          SIMULACAO_MANUAL: ${{ inputs.dry_run }}
        run: |
          if [ "$SIMULACAO_MANUAL" = "true" ]; then
            echo "gravar=false" >> "$GITHUB_OUTPUT"
          elif [ "$HABILITAR_PUBLICACAO" = "SIM" ]; then
            echo "gravar=true" >> "$GITHUB_OUTPUT"
          else
            echo "gravar=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Instalar dependências
        run: pip install -r scripts/requirements.txt

      - name: Sincronizar
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID || vars.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_TAB_NAME: ${{ vars.GOOGLE_SHEET_TAB_NAME || 'Respostas ao formulário 1' }}
          PUBLIC_ID_SECRET: ${{ secrets.PUBLIC_ID_SECRET }}
        run: |
          if [ "${{ steps.modo.outputs.gravar }}" = "true" ]; then
            python scripts/sync_catalogo.py --saida public/data --dir-dados dados --publicar --verbose
          else
            python scripts/sync_catalogo.py --saida public/data --dir-dados dados --dry-run --verbose
          fi

      # Relatório da fila de moderação (retidos/motivos/bloqueios) como
      # artifact — consulta sem backend e sem escrita na planilha.
      - name: Publicar relatório de moderação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-moderacao
          path: dados/relatorio-moderacao.json
          if-no-files-found: ignore

      - name: Validar catálogo gerado
        if: steps.modo.outputs.gravar == 'true'
        run: python scripts/validar_catalogo.py public/data/profissionais.json

      # Gate de qualidade: os testes Python rodam ANTES de qualquer commit
      # de dados públicos — se falharem, o job para e o catálogo existente
      # no repositório permanece intacto.
      - name: Testes do sincronizador (pytest)
        if: steps.modo.outputs.gravar == 'true'
        run: pytest scripts/tests -q

      - uses: actions/setup-node@v4
        if: steps.modo.outputs.gravar == 'true'
        with:
          node-version: '20'
          cache: npm

      - name: Instalar site
        if: steps.modo.outputs.gravar == 'true'
        run: npm ci

      - name: Testes do site
        if: steps.modo.outputs.gravar == 'true'
        run: npm test

      - name: Build
        if: steps.modo.outputs.gravar == 'true'
        run: npm run build

      - name: Verificar mudanças
        if: steps.modo.outputs.gravar == 'true'
        id: mudancas
        run: |
          if git diff --quiet -- public/data dados/identidades.json; then
            echo "houve=false" >> "$GITHUB_OUTPUT"
          else
            echo "houve=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commitar
        if: steps.modo.outputs.gravar == 'true' && steps.mudancas.outputs.houve == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git add dados/identidades.json 2>/dev/null || true
          git commit -m "chore(sync): atualizar profissionais ($(date -u '+%Y-%m-%d %H:%M') UTC)"
          git push

      - name: Deploy Hook
        if: steps.modo.outputs.gravar == 'true' && steps.mudancas.outputs.houve == 'true'
        env:
          DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "Deploy Hook não configurado — publicação via integração Git."
            exit 0
          fi
          codigo=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$DEPLOY_HOOK_URL" --max-time 30) || codigo="erro"
          if [ "$codigo" = "200" ] || [ "$codigo" = "204" ]; then
            echo "Deploy solicitado (HTTP $codigo). Acompanhe a conclusão no painel."
          else
            echo "Deploy Hook respondeu HTTP $codigo." >&2
            exit 1
          fi
