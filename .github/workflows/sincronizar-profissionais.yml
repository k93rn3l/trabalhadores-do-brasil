name: Sincronizar profissionais

# LGPD: dados pessoais nunca são commitados. O repositório guarda apenas
# código; o catálogo é gerado no runner a partir da planilha privada,
# publicado por upload direto no Cloudflare Pages, e o estado operacional
# (identidades/exclusões, pseudonimizado por HMAC) vive no Cloudflare KV —
# nada fica em histórico versionado.

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simular sem gravar'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sincronizacao-profissionais
  cancel-in-progress: false

jobs:
  sincronizar:
    if: github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Determinar modo
        id: modo
        env:
          HABILITAR_PUBLICACAO: ${{ vars.HABILITAR_PUBLICACAO }}
          SIMULACAO_MANUAL: ${{ inputs.dry_run }}
        run: |
          if [ "$SIMULACAO_MANUAL" = "true" ]; then
            echo "gravar=false" >> "$GITHUB_OUTPUT"
          elif [ "$HABILITAR_PUBLICACAO" = "SIM" ]; then
            echo "gravar=true" >> "$GITHUB_OUTPUT"
          else
            echo "gravar=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Instalar dependências do sincronizador
        run: pip install -r scripts/requirements.txt

      # Estado operacional fora do repositório (Cloudflare KV). Sem ele, o
      # modo de gravação FALHA fechado: perder exclusões voluntárias poderia
      # republicar perfis removidos a pedido (segurança/LGPD).
      - name: Baixar estado operacional (KV)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$KV_NAMESPACE_ID" ]; then
            if [ "${{ steps.modo.outputs.gravar }}" = "true" ]; then
              echo "FALHA: modo de gravação exige CLOUDFLARE_API_TOKEN (secret) e" >&2
              echo "KV_NAMESPACE_ID (variable) para persistir identidades/exclusões fora do repositório." >&2
              exit 1
            fi
            echo "AVISO: KV não configurado — simulação sem estado persistente."
            exit 0
          fi
          mkdir -p dados
          npx --yes wrangler@3 kv key get identidades --namespace-id "$KV_NAMESPACE_ID" \
            --path dados/identidades.json \
            || echo "identidades ausentes no KV (primeira execução)"
          npx --yes wrangler@3 kv key get exclusoes --namespace-id "$KV_NAMESPACE_ID" \
            --path dados/exclusoes.json \
            || echo "exclusões ausentes no KV (primeira execução)"

      - name: Sincronizar
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID || vars.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          # Aba consolidada pelo Apps Script. A variável de repositório
          # GOOGLE_SHEET_TAB_NAME (Settings > Variables), se definida,
          # PREVALECE sobre o padrão abaixo.
          GOOGLE_SHEET_TAB_NAME: ${{ vars.GOOGLE_SHEET_TAB_NAME || 'CADASTROS_SINCRONIZADOS' }}
          PUBLIC_ID_SECRET: ${{ secrets.PUBLIC_ID_SECRET }}
        run: |
          if [ "${{ steps.modo.outputs.gravar }}" = "true" ]; then
            python scripts/sync_catalogo.py --saida public/data --dir-dados dados --publicar --verbose
          else
            python scripts/sync_catalogo.py --saida public/data --dir-dados dados --dry-run --verbose
          fi

      # Relatório da fila de moderação (linha/motivo, sem dados pessoais)
      # como artifact — consulta sem backend e sem escrita na planilha.
      - name: Publicar relatório de moderação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-moderacao
          path: dados/relatorio-moderacao.json
          if-no-files-found: ignore

      - name: Validar catálogo gerado
        if: steps.modo.outputs.gravar == 'true'
        run: python scripts/validar_catalogo.py public/data/profissionais.json

      # Gate de qualidade: testes rodam antes de qualquer publicação.
      - name: Testes do sincronizador (pytest)
        if: steps.modo.outputs.gravar == 'true'
        run: pytest scripts/tests -q

      - uses: actions/setup-node@v4
        if: steps.modo.outputs.gravar == 'true'
        with:
          node-version: '20'
          cache: npm

      - name: Instalar site
        if: steps.modo.outputs.gravar == 'true'
        run: npm ci

      - name: Testes do site
        if: steps.modo.outputs.gravar == 'true'
        run: npm test

      - name: Build
        if: steps.modo.outputs.gravar == 'true'
        run: npm run build

      - name: Publicar estado operacional (KV)
        if: steps.modo.outputs.gravar == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID }}
        run: |
          npx --yes wrangler@3 kv key put identidades --namespace-id "$KV_NAMESPACE_ID" --path dados/identidades.json
          npx --yes wrangler@3 kv key put exclusoes --namespace-id "$KV_NAMESPACE_ID" --path dados/exclusoes.json

      # Upload direto do build: o site publicado contém os dados públicos
      # consentidos, mas nada fica versionado no repositório.
      - name: Publicar site (Cloudflare Pages, upload direto)
        if: steps.modo.outputs.gravar == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${{ vars.CLOUDFLARE_PAGES_PROJECT }}" ]; then
            echo "FALHA: defina a variable CLOUDFLARE_PAGES_PROJECT (projeto Pages de upload direto) para publicar o site." >&2
            exit 1
          fi
          npx --yes wrangler@3 pages deploy dist \
            --project-name="${{ vars.CLOUDFLARE_PAGES_PROJECT }}" \
            --branch=main --commit-dirty=true

      # LGPD: cada deployment do Pages fica acessível para sempre em
      # <hash>.<projeto>.pages.dev — sem esta limpeza, um perfil excluído
      # continuaria público na versão anterior do site. Mantemos apenas o
      # deployment de produção vigente; "rollback" = reexecutar a
      # sincronização (a planilha é a fonte da verdade).
      - name: Remover deployments antigos (LGPD)
        if: steps.modo.outputs.gravar == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          PROJETO="${{ vars.CLOUDFLARE_PAGES_PROJECT }}"
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJETO/deployments"
          AUT="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          ATUAL=$(curl -sf -H "$AUT" "$API?env=production" | jq -r '.result[0].id')
          if [ -z "$ATUAL" ] || [ "$ATUAL" = "null" ]; then
            echo "FALHA: não foi possível identificar o deployment de produção vigente." >&2
            exit 1
          fi
          FALHAS=0
          for ID in $(curl -sf -H "$AUT" "$API?per_page=100" | jq -r '.result[].id' | grep -v "^$ATUAL$"); do
            echo "removendo deployment antigo $ID"
            curl -sf -X DELETE -H "$AUT" "$API/$ID" > /dev/null \
              || { echo "FALHA: não foi possível remover o deployment $ID — dado antigo pode seguir acessível." >&2; FALHAS=$((FALHAS+1)); }
          done
          echo "Deployments restantes: apenas o vigente ($ATUAL)."
          [ "$FALHAS" -eq 0 ] || exit 1
