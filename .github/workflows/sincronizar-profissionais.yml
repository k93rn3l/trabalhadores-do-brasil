name: Sincronizar profissionais

# Google Sheets (privado) -> JSON público -> commit -> Cloudflare Pages.
#
# Segurança da primeira publicação: o job somente GRAVA quando a variável de
# repositório HABILITAR_PUBLICACAO estiver igual a "SIM" (Settings > Secrets and
# variables > Actions > Variables). Antes disso, toda execução é SIMULAÇÃO
# (--dry-run): lê a planilha, valida e relata contagens sem tocar no catálogo.
#
# Nota: commits criados com GITHUB_TOKEN não disparam outros workflows do
# GitHub Actions (comportamento do GitHub). Os testes e o build rodaram neste
# próprio workflow antes do commit; a publicação no Cloudflare Pages acontece
# pela integração Git do Pages e, opcionalmente, pelo Deploy Hook abaixo.

on:
  schedule:
    - cron: '0 * * * *' # a cada hora (UTC)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simular sem gravar (ignora a habilitação de produção)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sincronizacao-profissionais
  cancel-in-progress: false

jobs:
  sincronizar:
    # schedule/dispatch nunca disparam em pull requests; guard por segurança.
    if: github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest

    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Determinar modo (gravação ou simulação)
        id: modo
        env:
          HABILITAR_PUBLICACAO: ${{ vars.HABILITAR_PUBLICACAO }}
          SIMULACAO_MANUAL: ${{ inputs.dry_run }}
        run: |
          if [ "$SIMULACAO_MANUAL" = "true" ]; then
            echo "gravar=false" >> "$GITHUB_OUTPUT"
            echo "motivo=execução manual em modo de simulação" >> "$GITHUB_OUTPUT"
          elif [ "$HABILITAR_PUBLICACAO" = "SIM" ]; then
            echo "gravar=true" >> "$GITHUB_OUTPUT"
            echo "motivo=publicação habilitada (HABILITAR_PUBLICACAO=SIM)" >> "$GITHUB_OUTPUT"
          else
            echo "gravar=false" >> "$GITHUB_OUTPUT"
            echo "motivo=publicação NÃO habilitada — defina a variável HABILITAR_PUBLICACAO=SIM para gravar" >> "$GITHUB_OUTPUT"
          fi

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Instalar dependências do sincronizador
        run: pip install -r scripts/requirements.txt

      - name: Sincronizar Google Sheets → JSON
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID || vars.GOOGLE_SHEET_ID || '1nxcIvRTlAf1HTXbNaeq6oo3gOJN8L52hbcL6NGzTk3M' }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_TAB_NAME: ${{ vars.GOOGLE_SHEET_TAB_NAME || 'Respostas ao formulário 1' }}
          PUBLIC_ID_SECRET: ${{ secrets.PUBLIC_ID_SECRET }}
        run: |
          echo "Motivo do modo: ${{ steps.modo.outputs.motivo }}"
          if [ "${{ steps.modo.outputs.gravar }}" = "true" ]; then
            python scripts/sync_catalogo.py --saida public/data --publicar --verbose
          else
            python scripts/sync_catalogo.py --saida public/data --dry-run --verbose
          fi

      # ---- As etapas abaixo só existem em modo de gravação ----
      - name: Validar catálogo gerado
        if: steps.modo.outputs.gravar == 'true'
        run: python scripts/validar_catalogo.py public/data/profissionais.json

      - name: Preparar Node.js
        if: steps.modo.outputs.gravar == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependências do site
        if: steps.modo.outputs.gravar == 'true'
        run: npm ci

      - name: Executar testes do site
        if: steps.modo.outputs.gravar == 'true'
        run: npm test

      - name: Testar build de produção com os novos dados
        if: steps.modo.outputs.gravar == 'true'
        run: npm run build

      - name: Verificar se houve alteração real nos dados
        if: steps.modo.outputs.gravar == 'true'
        id: mudancas
        run: |
          if git diff --quiet -- public/data; then
            echo "houve=false" >> "$GITHUB_OUTPUT"
          else
            echo "houve=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commitar catálogo atualizado
        if: steps.modo.outputs.gravar == 'true' && steps.mudancas.outputs.houve == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "chore(sync): atualizar profissionais ($(date -u '+%Y-%m-%d %H:%M') UTC)"
          git push

      - name: Disparar Deploy Hook do Cloudflare Pages
        if: steps.modo.outputs.gravar == 'true' && steps.mudancas.outputs.houve == 'true'
        env:
          DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "AVISO: CLOUDFLARE_DEPLOY_HOOK_URL não configurado — publicação automática dependerá apenas da integração Git do Cloudflare Pages."
            exit 0
          fi
          codigo=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$DEPLOY_HOOK_URL" --max-time 30) || codigo="erro"
          if [ "$codigo" = "200" ] || [ "$codigo" = "204" ]; then
            echo "Deploy SOLICITADO no Cloudflare Pages (HTTP $codigo)."
            echo "Atenção: isto confirma apenas o acionamento — acompanhe a conclusão em Workers & Pages > Deployments."
          else
            echo "ERRO: o Deploy Hook respondeu HTTP $codigo. O commit foi feito; verifique a URL do hook e o painel do Cloudflare." >&2
            exit 1
          fi

      - name: Resumo
        if: always()
        run: |
          echo "Modo: ${{ steps.modo.outputs.gravar == 'true' && 'GRAVAÇÃO' || 'SIMULAÇÃO' }} (${{ steps.modo.outputs.motivo }})"
          echo "Alterações nos dados: ${{ steps.mudancas.outputs.houve == 'true' && 'sim (commit criado)' || 'não ou não aplicável' }}"
